version: "3.9"

services:
  # ── Application Waterflow 2 ─────────────────────────────────────────────────
  waterflow2:
    build: .
    ports:
      - "8080:8080"
    environment:
      # ── Obligatoires ───────────────────────────────────────────
      - DATABASE_URL=sqlite:////data/waterflow2.db
      - MLFLOW_TRACKING_URI=sqlite:////data/mlflow_water.db
      - MLFLOW_URI=${MLFLOW_URI:-models:/WaterQualityXGBoost/1}
      - SCALER_PATH=/app/model_artifacts/robust_scaler.pkl
      # ── OCR ────────────────────────────────────────────────────
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Limites ────────────────────────────────────────────────
      - MAX_UPLOAD_MB=20
      - FLASK_ENV=production
    volumes:
      - waterflow_data:/data
      - ./model_artifacts:/app/model_artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - waterflow2

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-waterflow}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/waterflow.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  waterflow_data:
  prometheus_data:
  grafana_data:
