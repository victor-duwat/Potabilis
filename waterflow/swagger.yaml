openapi: "2.0"
info:
  title: "Waterflow 2 — API MLOps Qualité de l'Eau"
  description: |
    Plateforme MLOps pour la classification de la potabilité de l'eau.

    ## Authentification

    **Clients (collectivités)** : header `X-API-Key: <votre_clé>`
    ou paramètre `?api_key=<votre_clé>`

    **Experts (analystes / exploit)** : header `Authorization: Bearer <token>`

    Les tokens experts sont configurés côté serveur via la variable d'environnement
    `EXPERT_TOKENS` au format `login:token:role,login2:token2:role2`.

    Rôles experts disponibles : `analyste`, `exploit` (super-rôle qui inclut analyste).
  version: "2.0.0"
  contact:
    name: "Waterflow 2 — La Plateforme B3IA"

host: "localhost:8080"
basePath: "/"
schemes:
  - http
  - https

consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  ApiKeyHeader:
    type: apiKey
    in: header
    name: X-API-Key
  BearerToken:
    type: apiKey
    in: header
    name: Authorization
    description: "Format : Bearer <token>"

tags:
  - name: Public
    description: Routes sans authentification
  - name: Client
    description: Routes accessibles avec une clé API client
  - name: Ingestion
    description: Dépôt de prélèvements (manuel ou OCR)
  - name: Admin
    description: Gestion des comptes clients (tout expert)
  - name: Analyste
    description: Consultation globale et dashboards (rôle analyste+)
  - name: Exploitation
    description: Monitoring système (rôle exploit uniquement)

paths:

  # ── PUBLIC ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Public]
      summary: Santé du service
      description: Retourne l'état du service, la version du modèle et l'horodatage.
      responses:
        200:
          description: Service opérationnel
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ok"
              model:
                type: string
                example: "models:/WaterQualityXGBoost/1"
              ts:
                type: string
                format: date-time

  # ── CLIENT ──────────────────────────────────────────────────────────────────

  /me:
    get:
      tags: [Client]
      summary: Profil du client authentifié
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Profil client
          schema:
            $ref: "#/definitions/ClientProfile"
        401:
          $ref: "#/responses/Unauthorized"

  /me/prelevements:
    get:
      tags: [Client]
      summary: Mes prélèvements (paginés)
      security:
        - ApiKeyHeader: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: date_debut
          in: query
          type: string
          format: date
          description: Filtre date début (YYYY-MM-DD)
        - name: date_fin
          in: query
          type: string
          format: date
          description: Filtre date fin (YYYY-MM-DD)
      responses:
        200:
          description: Liste paginée de prélèvements
          schema:
            $ref: "#/definitions/PaginatedPrelevements"
        401:
          $ref: "#/responses/Unauthorized"

  /me/prelevements/{id}:
    get:
      tags: [Client]
      summary: Détail d'un prélèvement
      security:
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Détail du prélèvement avec mesures et prédiction
          schema:
            $ref: "#/definitions/Prelevement"
        403:
          $ref: "#/responses/Forbidden"
        404:
          $ref: "#/responses/NotFound"

  /me/resultats:
    get:
      tags: [Client]
      summary: Mes résultats de prédiction
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Liste des prédictions du client
          schema:
            type: object

  /me/rgpd:
    get:
      tags: [Client]
      summary: Données personnelles (droit d'accès RGPD)
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Profil complet + historique d'accès + règles de conservation
    delete:
      tags: [Client]
      summary: Droit à l'effacement (RGPD)
      description: Anonymise le compte de façon irréversible.
      security:
        - ApiKeyHeader: []
      responses:
        200:
          description: Compte anonymisé
        401:
          $ref: "#/responses/Unauthorized"

  # ── INGESTION ────────────────────────────────────────────────────────────────

  /ingest/manual:
    post:
      tags: [Ingestion]
      summary: Déposer des mesures JSON et obtenir une prédiction
      security:
        - ApiKeyHeader: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ManualIngestRequest"
      responses:
        201:
          description: Prélèvement créé et prédiction retournée
          schema:
            $ref: "#/definitions/IngestResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"
        422:
          description: Mesures invalides ou incomplètes

  /ingest/ocr:
    post:
      tags: [Ingestion]
      summary: Déposer une fiche labo (OCR uniquement, sans prédiction)
      description: |
        Accepte un fichier image (JPEG, PNG, WEBP, GIF) ou PDF (max 20 Mo).
        Extrait les données via OCR.space (primaire) ou Claude Vision (fallback).
        Crée un prélèvement structuré même si certaines mesures manquent.
      security:
        - ApiKeyHeader: []
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
          required: true
          description: Fiche de laboratoire (image ou PDF)
      responses:
        201:
          description: Prélèvement créé depuis OCR
          schema:
            $ref: "#/definitions/OcrResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"
        422:
          description: Fichier illisible ou type non supporté

  /ingest/ocr-and-predict:
    post:
      tags: [Ingestion]
      summary: Pipeline complet — OCR + prédiction en un appel
      description: |
        Enchaîne l'extraction OCR et la prédiction ML.
        Si des mesures sont manquantes après OCR, `prediction_possible` sera `false`
        et le prélèvement est quand même sauvegardé.
      security:
        - ApiKeyHeader: []
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
          required: true
      responses:
        201:
          description: Prélèvement + prédiction (si possible)
          schema:
            $ref: "#/definitions/OcrPredictResponse"
        400:
          $ref: "#/responses/BadRequest"
        401:
          $ref: "#/responses/Unauthorized"

  # ── ADMIN ────────────────────────────────────────────────────────────────────

  /admin/clients:
    get:
      tags: [Admin]
      summary: Lister tous les clients
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Liste paginée des clients
        401:
          $ref: "#/responses/Unauthorized"
    post:
      tags: [Admin]
      summary: Créer un compte client
      security:
        - BearerToken: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CreateClientRequest"
      responses:
        201:
          description: Client créé (sans clé API — générer via /apikey)
          schema:
            $ref: "#/definitions/ClientProfile"
        400:
          $ref: "#/responses/BadRequest"
        409:
          description: id_client déjà existant

  /admin/clients/{id}:
    get:
      tags: [Admin]
      summary: Détail d'un client
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: UUID ou id_client métier
      responses:
        200:
          description: Détail client
        404:
          $ref: "#/responses/NotFound"
    put:
      tags: [Admin]
      summary: Modifier denomination / adresse / statut actif
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          schema:
            $ref: "#/definitions/UpdateClientRequest"
      responses:
        200:
          description: Client mis à jour
        404:
          $ref: "#/responses/NotFound"

  /admin/clients/{id}/apikey:
    post:
      tags: [Admin]
      summary: Générer ou régénérer la clé API d'un client
      description: |
        La clé brute est retournée **une seule fois** dans la réponse.
        Elle n'est jamais stockée en clair. L'ancienne clé est immédiatement révoquée.
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: Nouvelle clé API générée
          schema:
            type: object
            properties:
              api_key:
                type: string
                example: "wf2_xK9mP..."
              hint:
                type: string
                example: "wf2_"
              generated_at:
                type: string
                format: date-time
        404:
          $ref: "#/responses/NotFound"

  # ── ANALYSTE ─────────────────────────────────────────────────────────────────

  /analyste/prelevements:
    get:
      tags: [Analyste]
      summary: Tous les prélèvements (filtrables, paginés)
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: client_id
          in: query
          type: string
        - name: source
          in: query
          type: string
          enum: [manual, ocr, api]
        - name: date_debut
          in: query
          type: string
          format: date
        - name: date_fin
          in: query
          type: string
          format: date
      responses:
        200:
          description: Liste paginée
          schema:
            $ref: "#/definitions/PaginatedPrelevements"
        401:
          $ref: "#/responses/Unauthorized"

  /analyste/prelevements/{id}:
    get:
      tags: [Analyste]
      summary: Détail complet d'un prélèvement (avec texte OCR brut)
      security:
        - BearerToken: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        200:
          description: Prélèvement complet
        404:
          $ref: "#/responses/NotFound"

  /analyste/dashboard:
    get:
      tags: [Analyste]
      summary: KPIs qualité agrégés
      description: |
        Retourne : taux de potabilité, moyennes des 9 paramètres chimiques,
        répartition par source (MANUAL/OCR/API), 15 derniers prélèvements.
      security:
        - BearerToken: []
      responses:
        200:
          description: Dashboard agrégé
          schema:
            type: object
            properties:
              total_prelevements:
                type: integer
              taux_potabilite:
                type: number
                format: float
              moyennes_chimiques:
                type: object
              repartition_source:
                type: object
              derniers_prelevements:
                type: array
                items:
                  $ref: "#/definitions/Prelevement"

  # ── EXPLOITATION ──────────────────────────────────────────────────────────────

  /exploitation/metrics:
    get:
      tags: [Exploitation]
      summary: Métriques de performance (latence, volume, erreurs)
      security:
        - BearerToken: []
      responses:
        200:
          description: Métriques par route
          schema:
            type: object
            properties:
              metrics_by_route:
                type: array
                items:
                  type: object
                  properties:
                    route:
                      type: string
                    count:
                      type: integer
                    p50_ms:
                      type: number
                    p95_ms:
                      type: number
                    avg_ms:
                      type: number
                    error_rate:
                      type: number
        401:
          $ref: "#/responses/Unauthorized"
        403:
          $ref: "#/responses/Forbidden"

  /exploitation/audit:
    get:
      tags: [Exploitation]
      summary: Journal d'accès RGPD
      security:
        - BearerToken: []
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 50
        - name: actor_type
          in: query
          type: string
          enum: [client, expert]
        - name: action
          in: query
          type: string
        - name: date_debut
          in: query
          type: string
          format: date
        - name: date_fin
          in: query
          type: string
          format: date
      responses:
        200:
          description: Journal paginé
        401:
          $ref: "#/responses/Unauthorized"
        403:
          $ref: "#/responses/Forbidden"

# ── DÉFINITIONS ──────────────────────────────────────────────────────────────────

definitions:

  Mesures:
    type: object
    required:
      - ph
      - Hardness
      - Solids
      - Chloramines
      - Sulfate
      - Conductivity
      - Organic_carbon
      - Trihalomethanes
      - Turbidity
    properties:
      ph:
        type: number
        example: 7.2
      Hardness:
        type: number
        example: 182.5
      Solids:
        type: number
        example: 18630.0
      Chloramines:
        type: number
        example: 8.1
      Sulfate:
        type: number
        example: 310.0
      Conductivity:
        type: number
        example: 415.0
      Organic_carbon:
        type: number
        example: 14.2
      Trihalomethanes:
        type: number
        example: 66.4
      Turbidity:
        type: number
        example: 3.8

  ManualIngestRequest:
    type: object
    required: [mesures]
    properties:
      mesures:
        $ref: "#/definitions/Mesures"
      date_prelevement:
        type: string
        format: date-time
        example: "2025-03-18T09:30:00"
      lieu:
        type: string
        example: "Station de pompage Nord"
      observations:
        type: string

  Prediction:
    type: object
    properties:
      potable:
        type: integer
        enum: [0, 1]
      label:
        type: string
        enum: ["Potable", "Non potable"]
      probability:
        type: number
        format: float
        example: 0.78
      model:
        type: string
        example: "models:/WaterQualityXGBoost/1"
      at:
        type: string
        format: date-time

  Prelevement:
    type: object
    properties:
      id:
        type: string
        format: uuid
      client_id:
        type: string
        example: "CLIENT-001"
      date_prelevement:
        type: string
        format: date-time
      lieu:
        type: string
      source:
        type: string
        enum: [manual, ocr, api]
      observations:
        type: string
      mesures:
        $ref: "#/definitions/Mesures"
      prediction:
        $ref: "#/definitions/Prediction"
      warnings:
        type: array
        items:
          type: string

  PaginatedPrelevements:
    type: object
    properties:
      total:
        type: integer
      page:
        type: integer
      per_page:
        type: integer
      pages:
        type: integer
      items:
        type: array
        items:
          $ref: "#/definitions/Prelevement"

  IngestResponse:
    type: object
    properties:
      prelevement_id:
        type: string
        format: uuid
      prediction:
        $ref: "#/definitions/Prediction"

  OcrResponse:
    type: object
    properties:
      prelevement_id:
        type: string
        format: uuid
      prediction_possible:
        type: boolean
      extraction:
        type: object
      warnings:
        type: array
        items:
          type: string
      ocr_provider:
        type: string
        enum: [ocr_space, claude_vision]

  OcrPredictResponse:
    allOf:
      - $ref: "#/definitions/OcrResponse"
      - type: object
        properties:
          prediction:
            $ref: "#/definitions/Prediction"

  ClientProfile:
    type: object
    properties:
      id:
        type: string
        format: uuid
      id_client:
        type: string
        example: "CLIENT-001"
      denomination:
        type: string
        example: "Mairie de Marseille"
      adresse:
        type: string
      actif:
        type: boolean
      api_key_hint:
        type: string
        example: "wf2_"
      created_at:
        type: string
        format: date-time

  CreateClientRequest:
    type: object
    required: [id_client, denomination, adresse]
    properties:
      id_client:
        type: string
        example: "CLIENT-042"
      denomination:
        type: string
        example: "Commune de Toulon"
      adresse:
        type: string
        example: "Place de la Liberté, 83000 Toulon"

  UpdateClientRequest:
    type: object
    properties:
      denomination:
        type: string
      adresse:
        type: string
      actif:
        type: boolean

responses:
  Unauthorized:
    description: Clé API ou token manquant ou invalide
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Clé API invalide ou absente."
  Forbidden:
    description: Accès refusé (rôle insuffisant ou périmètre dépassé)
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Accès refusé."
  NotFound:
    description: Ressource introuvable
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Prélèvement introuvable."
  BadRequest:
    description: Requête invalide
    schema:
      type: object
      properties:
        error:
          type: string
