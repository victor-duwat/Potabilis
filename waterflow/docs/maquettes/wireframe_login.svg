<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect width="720" height="440" fill="#f6f8fa"/>
  <rect x="0" y="0" width="720" height="40" fill="#1f3a5f"/>
  <text x="16" y="26" fill="#ffffff" font-size="16" font-weight="bold">Waterflow 2 — Plateforme qualité de l'eau</text>

  <!-- Carte de connexion -->
  <rect x="210" y="90" width="300" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3a5f">Connexion</text>

  <!-- Onglets Client / Expert -->
  <rect x="234" y="146" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="294" y="166" text-anchor="middle" font-size="12" fill="#ffffff">Client</text>
  <rect x="366" y="146" width="120" height="30" rx="6" fill="#e2e8f0"/>
  <text x="426" y="166" text-anchor="middle" font-size="12" fill="#334155">Expert</text>

  <!-- Champ clé API -->
  <text x="234" y="206" font-size="11" fill="#475569">Clé API</text>
  <rect x="234" y="212" width="252" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="246" y="234" font-size="12" fill="#94a3b8">••••••••••••••••</text>

  <!-- Bouton -->
  <rect x="234" y="266" width="252" height="38" rx="8" fill="#2563eb"/>
  <text x="360" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Se connecter</text>

  <text x="360" y="334" text-anchor="middle" font-size="11" fill="#2563eb" text-decoration="underline">Documentation API (Swagger)</text>

  <!-- Note accessibilité -->
  <text x="234" y="366" font-size="9.5" fill="#64748b">Contraste AA · navigation clavier (Tab) · label associé au champ</text>

  <text x="16" y="424" font-size="10" fill="#94a3b8">Maquette (wireframe) — Écran de connexion · Waterflow 2</text>
</svg>
