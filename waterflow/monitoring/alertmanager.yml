# =====================================================================
# Alertmanager — routage des alertes Waterflow 2 (compétence C20)
# Canal de notification : Slack (webhook) + e-mail (à renseigner en prod).
# =====================================================================
global:
  resolve_timeout: 5m

route:
  receiver: "equipe-exploitation"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: "equipe-exploitation"
      repeat_interval: 1h

receivers:
  - name: "equipe-exploitation"
    # Canal Slack. En production : remplacer cette URL de démonstration par le
    # vrai webhook (injecté hors Git). Alertmanager ne substitue PAS les variables
    # d'environnement dans ce fichier : l'URL doit être écrite en clair et valide.
    slack_configs:
      - api_url: "https://hooks.slack.com/services/EXAMPLE/DEMO/remplacer-par-le-vrai-webhook"
        channel: "#waterflow-alertes"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    # E-mail : décommenter et configurer un serveur SMTP en production
    # email_configs:
    #   - to: "exploitation@waterflow.example"
    #     from: "alertes@waterflow.example"
    #     smarthost: "smtp.example:587"
