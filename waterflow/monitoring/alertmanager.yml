# =====================================================================
# Alertmanager — routage des alertes Waterflow 2 (compétence C20)
# Canal de notification : Slack (webhook) + e-mail (à renseigner en prod).
# =====================================================================
global:
  resolve_timeout: 5m

route:
  receiver: "equipe-exploitation"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: "equipe-exploitation"
      repeat_interval: 1h

receivers:
  - name: "equipe-exploitation"
    # Slack : remplacer par un vrai webhook en production (secret hors Git)
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#waterflow-alertes"
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    # E-mail : décommenter et configurer un serveur SMTP en production
    # email_configs:
    #   - to: "exploitation@waterflow.example"
    #     from: "alertes@waterflow.example"
    #     smarthost: "smtp.example:587"
